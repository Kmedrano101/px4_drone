<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>px4_drone - control de campo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, Roboto, sans-serif;
    margin: 0; padding: 0 0 24px 0;
    background: #111; color: #eee;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: #1a1a1a; border-bottom: 1px solid #333;
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  #stop-btn {
    background: #c0392b; color: #fff; border: none; border-radius: 8px;
    padding: 14px 20px; font-size: 16px; font-weight: bold;
    min-width: 110px;
  }
  #stop-btn:disabled { background: #555; color: #999; }

  #status-panel { padding: 12px 16px; }
  #status-line { font-size: 15px; margin-bottom: 6px; }
  #status-line.running { color: #f1c40f; font-weight: bold; }
  #status-line.idle { color: #888; }
  #log-box {
    background: #000; color: #0f0; font-family: monospace; font-size: 11px;
    padding: 8px; border-radius: 6px; height: 160px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  main { padding: 8px 16px; }
  .card {
    background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
    padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 4px 0; }
  .card p.desc { font-size: 13px; color: #aaa; margin: 0 0 10px 0; }
  .card.takeoff { border-color: #a04000; }

  .field { margin-bottom: 8px; }
  .field label { display: block; font-size: 12px; color: #ccc; margin-bottom: 2px; }
  .field input[type=number] {
    width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #444;
    background: #222; color: #eee; font-size: 15px;
  }

  .confirm-row {
    display: flex; align-items: center; gap: 8px; margin: 10px 0;
    background: #2a1a00; border: 1px solid #a04000; border-radius: 6px;
    padding: 8px 10px;
  }
  .confirm-row input { width: 20px; height: 20px; }
  .confirm-row label { font-size: 13px; color: #f0b060; }

  .launch-btn {
    width: 100%; padding: 14px; border: none; border-radius: 8px;
    background: #2980b9; color: #fff; font-size: 16px; font-weight: bold;
    margin-top: 4px;
  }
  .card.takeoff .launch-btn { background: #d35400; }
  .launch-btn:disabled { background: #444; color: #888; }

  .err { color: #e74c3c; font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>

<header>
  <h1>px4_drone &middot; campo</h1>
  <button id="stop-btn" onclick="stopTest()">STOP</button>
</header>

<div id="status-panel">
  <div id="status-line" class="idle">Sin test corriendo.</div>
  <div id="log-box"></div>
</div>

<main>
{% for id, t in tests.items() %}
  <div class="card {{ 'takeoff' if t.needs_confirm_takeoff else '' }}" id="card-{{ id }}">
    <h2>{{ t.label }}</h2>
    <p class="desc">{{ t.desc }}</p>

    {% for p in t.params %}
    <div class="field">
      <label for="{{ id }}-{{ p.key }}">{{ p.label }}</label>
      <input type="number" id="{{ id }}-{{ p.key }}"
             value="{{ p.default }}" min="{{ p.min }}" max="{{ p.max }}" step="{{ p.step }}">
    </div>
    {% endfor %}

    {% if t.needs_confirm_takeoff %}
    <div class="confirm-row">
      <input type="checkbox" id="{{ id }}-confirm" onchange="updateButtons()">
      <label for="{{ id }}-confirm">Confirmo: espacio despejado, listo para despegue real</label>
    </div>
    {% endif %}

    <button class="launch-btn" id="{{ id }}-launch" onclick="launchTest('{{ id }}')">
      Lanzar
    </button>
    <div class="err" id="{{ id }}-err"></div>
  </div>
{% endfor %}
</main>

<script>
const TESTS = {{ tests | tojson }};
let lastRunning = false;

async function launchTest(id) {
  const t = TESTS[id];
  const params = {};
  for (const p of t.params) {
    params[p.key] = parseFloat(document.getElementById(`${id}-${p.key}`).value);
  }
  if (t.needs_confirm_takeoff) {
    params.confirm_takeoff = document.getElementById(`${id}-confirm`).checked;
  }
  params.test_id = id;

  const errEl = document.getElementById(`${id}-err`);
  errEl.textContent = "";
  try {
    const res = await fetch("/api/launch", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(params),
    });
    const data = await res.json();
    if (!res.ok) errEl.textContent = data.error || "Error al lanzar";
  } catch (e) {
    errEl.textContent = "Error de red: " + e;
  }
  poll();
}

async function stopTest() {
  await fetch("/api/stop", {method: "POST"});
  poll();
}

function updateButtons() {
  for (const id in TESTS) {
    const t = TESTS[id];
    const btn = document.getElementById(`${id}-launch`);
    let ok = !lastRunning;
    if (t.needs_confirm_takeoff) {
      const box = document.getElementById(`${id}-confirm`);
      if (!box.checked) ok = false;
    }
    btn.disabled = !ok;
  }
  document.getElementById("stop-btn").disabled = !lastRunning;
}

async function poll() {
  try {
    const res = await fetch("/api/status");
    const data = await res.json();
    lastRunning = data.running;

    const line = document.getElementById("status-line");
    if (data.running) {
      const label = TESTS[data.test_id] ? TESTS[data.test_id].label : data.test_id;
      let txt = `Corriendo: ${label} (${Math.round(data.elapsed_s)} s)`;
      if (data.bag_path) txt += ` &middot; grabando bag`;
      line.innerHTML = txt;
      line.className = "running";
    } else {
      line.textContent = "Sin test corriendo.";
      line.className = "idle";
    }

    const logBox = document.getElementById("log-box");
    const atBottom = logBox.scrollTop + logBox.clientHeight >= logBox.scrollHeight - 20;
    logBox.textContent = data.log_tail;
    if (atBottom) logBox.scrollTop = logBox.scrollHeight;
  } catch (e) {
    // red caida momentaneamente, reintenta en el proximo tick
  }
  updateButtons();
}

updateButtons();
poll();
setInterval(poll, 1500);
</script>

</body>
</html>
